name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly canary: a scheduled run uses the latest official toolchain so an
    # upstream compatibility break shows up before it reaches a release.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Toolchain this revision is verified against; printed by `moon version --all`
  # in the "Toolchain" step below.
  MOONBIT_VERSION: 0.10.20+65efd5b93

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: ${{ github.event_name == 'schedule' && 'latest' || env.MOONBIT_VERSION }}
          core-version: ${{ github.event_name == 'schedule' && 'latest' || env.MOONBIT_VERSION }}
      - name: Toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Public API
        run: moon info
      - name: Strict check
        run: moon check --target all --deny-warn
      - name: Build
        run: moon build --target all
      - name: Strict tests
        run: moon test --target all --deny-warn
      - name: Runnable examples
        shell: bash
        run: |
          set -euo pipefail
          moon run examples/quickstart
          moon run examples/matchers
      - name: Package manifest
        run: moon package --list
